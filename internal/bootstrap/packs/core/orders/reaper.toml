# Converted from formula+pool to exec. All reaper operations are
# deterministic gc bd verbs per bead scope (read-only gc bd sql selections, then
# gc bd close/update/purge/prune/delete) plus count thresholds. No LLM judgment
# needed — runs inline in the controller. The timeout covers one bd fork per
# selection and per verb batch across the city and every rig scope.
# GC_REAPER_STALE_ISSUE_AGE defaults to 720h; set it to off, never, or any zero duration in Go's grammar (0, 0h, 0.0h, .0h, 0µs, -0, 0h0m, 0ms) to disable age-based issue closes; a positive whole number of hours (Nh or N) sets the age; any other value disables age-based closes for that run and prints one line naming the value, never a guessed threshold.
# For zero values, a duration follows Go's grammar, every component with a unit; a bare run of zero digits, optionally signed, also disables; a component without a unit beside another component is not a duration.
[order]
description = "Reap stale wisps and purge closed molecules"
exec = "$PACK_DIR/assets/scripts/reaper.sh"
trigger = "cooldown"
interval = "30m"
timeout = "900s"
skip_aliases = ["mol-dog-reaper"]
